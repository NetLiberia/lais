# Serves the built web app and proxies /api to the API container (same origin, so the
# SameSite=Strict session cookie works).
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # Uploads: keep at or above MAX_UPLOAD_BYTES (10 MB by default).
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Hashed build assets can be cached; index.html must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
